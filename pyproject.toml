[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xrobotoolkit_teleop"
version = "1.0.3"
description = "Teleoperation demo with MuJoCo and UR5 robot"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Zhigen", email = "zhaozhigen@gmail.com"}
]
dependencies = [
    "numpy",
    "meshcat",
    "placo>=0.11.0",
    "xrobotoolkit-sdk>=1.1.0",
]

[project.optional-dependencies]
# Fixed-base X2 arms and optional simulated Omnihand Pro fingers.
x2 = [
    "coal",
    "mujoco",
    "tyro",
    "pyzmq",
]
# The original complete dependency set for all robot examples.
all = [
    "mujoco",
    "tyro",
    "pyzmq",
    "ur_rtde",
    "dynamixel-sdk",
    "rospkg",
    "torch",
    "dex_retargeting",
    "pyrealsense2",
    "opencv-python",
    "python-can",
    "piper_sdk",
]
dev = [
    "black",
]

[tool.setuptools.packages.find]
include = ["xrobotoolkit_teleop*"]

[tool.setuptools.package-data]
xrobotoolkit_teleop = ["../assets/**/*"]

[tool.black]
line-length = 120
